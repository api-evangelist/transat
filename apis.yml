apis:
- aid: transat:air-transat-ndc-direct-connect-api
  name: Air Transat NDC Direct Connect API (Radixx ConnectPoint)
  description: >-
    The direct-connect flight shopping, booking, payment and servicing API that Air
    Transat publishes to OTA and technology partners under its NDC programme. The only
    technical contract Transat publishes for it is the "Air Transat API specifications"
    PDF — the Radixx ConnectPoint API, Flight Booking Detailed View, version 2.2.4,
    updated May 2023 — a SOAP 1.1 / .NET WCF service using Radixx.ConnectPoint data
    contract namespaces and the tempuri.org service namespace. The document names the
    following operations across the shopping, offer, order, payment and notification
    stages: RetrieveFastFareSearch and RetrieveFareQuote / RetrieveFareQuoteShop
    (shopping and pricing, sourced either from the Radixx local system or the Sabre
    shopping cache), RetrieveSecurityToken (session and authorization), LoginTravelAgent
    and RetrieveAgencyCommission (agency identity and commissioning), SummaryPNR,
    CreatePNR (CommitSummary) and CreatePNR (SaveReservation) and RetrievePNR (order
    creation and retrieval, including codeshare, interline and AMCI examples),
    ConvertCurrencies and ProcessPNRPayment (payment), and Notification. Authentication
    is a LogonID / Password exchange that returns a SecurityGUID, scoped to
    AccessibleCarrierCode "TS". No base URL, WSDL, sandbox or OpenAPI is published;
    Transat assigns each partner a pre-configured travel agency, IATA number and
    credentials under a commercial agreement.
  humanURL: https://www.airtransat.com/en-CA/air-transat-ndc
