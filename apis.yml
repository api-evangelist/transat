name: Transat
kind: company
description: >-
  Transat A.T. Inc. (TSX: TRZ) is a Montreal-headquartered, vertically integrated
  Canadian leisure travel group. It operates Air Transat (IATA carrier code TS), a
  transatlantic and sun-destination leisure airline, alongside tour-operating brands
  (Transat / Transat Tours Canada Inc.) and one of Canada's largest retail travel
  agency networks (Transat Travel, Voyages Transat, Marlin Travel, Club Voyages).
  It sits on the supply side of the distribution chain: it owns the seat and package
  inventory, sells it direct through transat.com and airtransat.com, through its own
  retail agencies, through GDS/CRS EDIFACT channels governed by IATA Resolution 850m
  and BSP settlement, and — since its published NDC programme — through an Accelya
  Farelogix NDC gateway and a named set of NDC aggregators. Its API posture is
  partner-gated but not opaque: Air Transat publishes a public NDC connectivity page
  and a publicly downloadable 46-page "Air Transat API specifications" document, but
  that document is a proprietary Radixx ConnectPoint SOAP contract (v2.2.4, May 2023),
  not an IATA NDC schema. There is no self-serve developer portal, no machine-readable
  OpenAPI or WSDL, no published base URL, no sandbox, no bulk export operation, and no
  IATA NDC certification level is claimed. Credentials (a Transat-assigned IATA number,
  agency login and password) are issued only under a commercial agreement, and the site
  terms plus the CRS Booking and Ticketing Procedures Policy expressly prohibit scraping
  and prohibit redistributing Air Transat content to any third-party agent, GDS or
  metasearch engine without prior written consent.
