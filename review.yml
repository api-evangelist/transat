artifacts:
  openapiHarvested: false
  specsCount: 0
  machineReadableSpecFound: false
  humanReadableSpecFound: true
  humanReadableSpec:
    title: Radixx ConnectPoint API - Flight Booking Detailed View
    version: 2.2.4
    updated: 'May 2023'
    format: PDF, 46 pages
    sourceURL: https://staticcontent.transat.com/airtransat/pdf/EN/NDC-TS-Radixx-ConnectPoint-API-book-Flight.pdf
    fetchDate: '2026-07-28'
    httpStatus: 200
    bytes: 1004540
    vendored: false
    vendoringNote: >-
      Not committed to this repo. It is a third-party (Radixx / Sabre) copyrighted document
      that is neither OpenAPI, AsyncAPI, WSDL nor any other machine-parseable contract, so
      it cannot satisfy the "every harvested spec must parse" rule and would sit in openapi/
      misleadingly. It is linked with full provenance from apis.yml instead, and the openapi/
      directory is intentionally absent.

